# Publish ntee-valet to npm when a release tag is cut:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Single package at the repo root, no native builds (the ntee-db dependency
# ships its own prebuilds) — so unlike ntee-db's monorepo workflow there is
# no per-package diffing: the guard is that the tag must match the
# package.json version at the tagged commit.
#
# Auth: npm Trusted Publishing (OIDC) — the ntee-valet package on npmjs.com
# is configured with this repo + workflow filename as its trusted publisher.
# No token or secret involved; provenance is attested automatically.
name: npm-publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC: Trusted Publishing auth + provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          echo "package.json: $version, tag: $tag"
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - name: Test
        run: |
          npm run format:check
          npm test
      # Trusted Publishing (OIDC): no token — npm authenticates the workflow
      # run itself. Needs npm >= 11.5 (Node 22 bundles 10.x).
      - run: npm install -g npm@latest
      - name: Publish ntee-valet
        run: npm publish
